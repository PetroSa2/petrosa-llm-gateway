---
name: CI Checks

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pipeline:
    name: CI Pipeline
    # yamllint disable-line rule:line-length
    uses: PetroSa2/petrosa-shared-workflows/.github/workflows/ci-pipeline.yml@6aebf4f0a2d3829dc0b507f6c2ef0a464dcda01c
    with:
      service-name: 'llm-gateway'
      image-name: 'yurisa2/petrosa-llm-gateway'
      python-version: '3.11'
      # The image is built and pushed by deploy.yml on merge to main, as in
      # the other services; here the image smoke job below builds and
      # exercises it without pushing.
      skip-docker-build: true
      coverage-threshold: '40'
    secrets: inherit

  image-smoke:
    name: Image Smoke
    # GitHub-hosted, like the shared pipeline's image build: it needs Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the image and check it against the mock provider
        run: scripts/smoke.sh

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Replay CIO and Holmes burst
        run: make load-test
