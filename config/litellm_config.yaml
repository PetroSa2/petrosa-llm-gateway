---
# LiteLLM proxy configuration for petrosa-llm-gateway.
# Callers use only the Petrosa aliases below. Credentials and the provider
# endpoint come from the environment, which gateway/entrypoint.py fills from
# mounted Secret files: never write a key or a literal endpoint here.
model_list:
  - model_name: petrosa-primary
    litellm_params:
      model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_base: os.environ/PROVIDER_API_BASE
      api_key: os.environ/PROVIDER_API_KEY
  - model_name: petrosa-fallback
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: os.environ/PROVIDER_API_BASE
      api_key: os.environ/PROVIDER_API_KEY
  - model_name: petrosa-ops
    litellm_params:
      model: openai/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_base: os.environ/PROVIDER_API_BASE
      api_key: os.environ/PROVIDER_API_KEY

router_settings:
  # A slow or failing model goes to petrosa-fallback (the hook gives each attempt a share
  # of the caller's budget as its timeout). After a provider 429 the hook refuses the
  # fallback: the account is throttled, and the fallback model shares it (gw#3).
  fallbacks:
    - petrosa-primary: [petrosa-fallback]
    - petrosa-ops: [petrosa-fallback]
  # No router retries: a retry into a throttled account only adds a 429, and a refused
  # attempt would be retried with backoff for seconds. Every attempt is scheduled.
  num_retries: 0

litellm_settings:
  num_retries: 0
  # Prompt and completion bodies are never logged or stored.
  turn_off_message_logging: true
  json_logs: true
  # Every provider call waits for its turn in the shared scheduler (gateway/hooks.py).
  callbacks: gateway.hooks.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Callers are identified by static keys from mounted files, without a database;
  # this hook also keeps caller keys off every non-inference route (gateway/callers.py).
  custom_auth: gateway.callers.user_api_key_auth
